<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <!-- Cyan gradient for 'A' -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Yellow-gold gradient for 'M' -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wave gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Sticker Shadow Filter -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#073b61" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- OUTLINE / STICKER BORDER (Dark Navy Outer Stroke) -->
    <!-- Background Cloud/Bubble Badge Shape -->
    <path d="M 28,26 
             C 16,26 10,34 10,48 
             C 10,64 16,78 30,78 
             C 34,78 38,76 42,72 
             C 46,76 52,78 58,78 
             C 64,78 70,75 75,70 
             C 80,76 88,78 96,78 
             C 110,78 116,66 116,50 
             C 116,32 108,24 94,24 
             C 86,24 80,28 75,34 
             C 70,28 62,24 50,24 
             C 40,24 33,26 28,26 Z"
          fill="#ffffff"
          stroke="#0b2a45"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Mini cute wave splash at the base -->
    <path d="M 18,68 Q 28,62 38,68 T 58,68 T 78,68 T 98,68 Q 106,68 110,62"
          fill="none"
          stroke="#bae6fd"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- LETTER 'A' (Coastal Cyan) -->
    <g transform="translate(18, 18)">
      <!-- 'A' Body -->
      <path d="M 26,14 
               C 23,14 20,16 18,21 
               L 4,50 
               C 2,54 5,58 10,58 
               C 13,58 16,56 18,52 
               L 21,45 
               L 33,45 
               L 36,52 
               C 38,56 41,58 45,58 
               C 50,58 53,54 51,50 
               L 36,21 
               C 34,16 30,14 26,14 Z
               M 27,27 
               L 31,37 
               L 23,37 
               Z"
            fill="url(#cyanGrad)"
            stroke="#0b2a45"
            stroke-width="3.5"
            stroke-linejoin="round"/>

      <!-- Highlight shine on A -->
      <path d="M 24,18 C 22,21 16,36 14,42" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            opacity="0.8"/>
      <circle cx="27" cy="18" r="2" fill="#ffffff"/>
    </g>

    <!-- LETTER 'M' (Sun Sand Gold) -->
    <g transform="translate(56, 18)">
      <!-- 'M' Body -->
      <path d="M 10,58 
               C 14,58 17,55 17,50 
               L 17,34 
               L 24,47 
               C 26,50 30,50 32,47 
               L 39,34 
               L 39,50 
               C 39,55 42,58 46,58 
               C 51,58 54,54 54,49 
               L 54,23 
               C 54,17 48,14 43,17 
               L 28,34 
               L 13,17 
               C 8,14 2,17 2,23 
               L 2,49 
               C 2,54 5,58 10,58 Z"
            fill="url(#goldGrad)"
            stroke="#0b2a45"
            stroke-width="3.5"
            stroke-linejoin="round"/>

      <!-- Highlight shine on M -->
      <path d="M 7,24 L 7,38" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            opacity="0.8"/>
      <circle cx="10" cy="20" r="2" fill="#ffffff"/>
      <circle cx="46" cy="20" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Little cute sparkle / star near top right -->
    <path d="M 100,20 Q 100,26 106,26 Q 100,26 100,32 Q 100,26 94,26 Q 100,26 100,20 Z" 
          fill="#ffd84d" 
          stroke="#0b2a45" 
          stroke-width="1.5"/>

    <!-- Small water drop / splash on bottom left -->
    <circle cx="14" cy="56" r="2.5" fill="#38bdf8" stroke="#0b2a45" stroke-width="1.5"/>
  </g>
</svg>
