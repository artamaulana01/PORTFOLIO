  <path d="M25 56 Q28 54 31 57" stroke="#0b2a45" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M29 44 Q32 42 35 45" stroke="#0b2a45" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 32 Q37 30 40 33" stroke="#0b2a45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Coconuts -->
  <circle cx="36" cy="24" r="3.5" fill="#78350f" stroke="#0b2a45" stroke-width="2"/>
  <circle cx="42" cy="24" r="3.5" fill="#78350f" stroke="#0b2a45" stroke-width="2"/>
  <circle cx="39" cy="28" r="3.5" fill="#78350f" stroke="#0b2a45" stroke-width="2"/>
