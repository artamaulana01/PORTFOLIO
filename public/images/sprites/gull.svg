<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" fill="none">
  <!-- Seagull Neo-Brutalist -->
  <g class="gull-wings">
    <!-- Left Wing (Back) -->
    <path d="M28 20 C22 10 14 6 6 8 C10 16 18 20 28 23 Z" fill="#e2e8f0" stroke="#0b2a45" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M6 8 C9 12 11 15 13 16" stroke="#0b2a45" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="32" cy="24" rx="16" ry="8" fill="#ffffff" stroke="#0b2a45" stroke-width="2.8"/>
    <!-- Tail -->
    <path d="M16 25 L8 28 L14 22 Z" fill="#cbd5e1" stroke="#0b2a45" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="44" cy="20" r="7" fill="#ffffff" stroke="#0b2a45" stroke-width="2.8"/>
    <!-- Beak -->
    <path d="M50 20 L58 22 L50 24 Z" fill="#ffd84d" stroke="#0b2a45" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="53" cy="22" r="1" fill="#ff7828"/>
    <!-- Eye -->
    <circle cx="45" cy="18" r="1.8" fill="#0b2a45"/>
    <!-- Right Wing (Front) -->
    <path d="M30 22 C34 10 44 4 52 5 C46 14 40 19 32 25 Z" fill="#ffffff" stroke="#0b2a45" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M48 6 C44 11 41 15 38 18" stroke="#0b2a45" stroke-width="2"/>
  </g>
</svg>

