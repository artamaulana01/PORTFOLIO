<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36" fill="none">
  <!-- Small Sky Banner Airplane -->
  <!-- Main Fuselage -->
  <path d="M10 18 C14 14 26 13 46 14 C56 14.5 60 17 62 18 C60 19 56 21.5 46 22 C26 23 14 22 10 18 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Nose cone -->
  <path d="M60 17 C62 17.5 63 18 63 18 C63 18 62 18.5 60 19 Z" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  <!-- Cockpit Window -->
  <path d="M46 15 H52 C54 15 55 16 54 17.5 L53 18 H46 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Wing Top -->
  <path d="M30 14 L24 4 C23 2.5 25 2 27 2.5 L39 14 Z" fill="#facc15" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Wing Bottom / Front -->
  <path d="M28 22 L22 32 C21 33.5 23 34 25 33.5 L37 22 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Tail fin -->
  <path d="M12 18 L6 8 C5.2 6.8 6.5 6 7.8 6.5 L17 17 Z" fill="#ef4444" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Propeller -->
  <line x1="62" y1="12" x2="62" y2="24" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Exhaust puffs -->
  <circle cx="4" cy="18" r="2" fill="rgba(255,255,255,0.7)"/>
  <circle cx="1" cy="17" r="1.2" fill="rgba(255,255,255,0.5)"/>
</svg>

